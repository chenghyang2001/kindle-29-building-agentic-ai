<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本機報名表單</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; background: #f4f6f8; margin: 0; padding: 32px 16px; }
  main { max-width: 420px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin-top: 0; }
  label { display: block; margin: 14px 0 6px; font-weight: 600; }
  input[type=text], input[type=email], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: normal; }
  button { margin-top: 18px; width: 100%; padding: 10px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-size: 16px; cursor: pointer; }
  #error { color: #c00; margin-top: 10px; min-height: 1em; }
  #result { margin-top: 16px; padding: 12px; background: #e7f6ec; color: #136c2e; border-radius: 6px; display: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>工作坊報名</h1>
  <form id="signup" novalidate>
    <label for="name">姓名</label>
    <input id="name" name="name" type="text" placeholder="請輸入姓名">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="name@example.com">

    <label for="plan">方案</label>
    <select id="plan" name="plan">
      <option value="">-- 請選擇 --</option>
      <option value="basic">基本方案</option>
      <option value="pro">進階方案</option>
      <option value="team">團隊方案</option>
    </select>

    <label class="check"><input id="agree" name="agree" type="checkbox"> 我同意服務條款</label>

    <button id="submit" type="submit">送出</button>
    <div id="error" role="alert"></div>
  </form>
  <div id="result" aria-live="polite"></div>
</main>
<script>
  // 純前端：不送出到任何伺服器，只在同頁顯示結果
  const form = document.getElementById('signup');
  const errorBox = document.getElementById('error');
  const resultBox = document.getElementById('result');

  function validateForm() {
    const name = form.name.value.trim();
    const email = form.email.value.trim();
    if (!name) return '請填寫姓名';
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return 'Email 格式不正確';
    if (!form.plan.value) return '請選擇方案';
    if (!form.agree.checked) return '請勾選同意條款';
    return '';
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    try {
      const message = validateForm();
      errorBox.textContent = message;
      if (message) return;
      resultBox.textContent = '已送出：' + form.name.value.trim();
      resultBox.style.display = 'block';
    } catch (err) {
      errorBox.textContent = '發生錯誤：' + err.message;
    }
  });
</script>
</body>
</html>
